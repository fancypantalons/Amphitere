plugins {
  id 'com.android.application'
}

android {
  namespace 'ca.b_ark.amphitere'
  compileSdk 34
  buildToolsVersion "35.0.0"

  signingConfigs {
    release {
      storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  defaultConfig {
    applicationId 'ca.b_ark.amphitere'
    minSdk 33
    targetSdk 34
    versionName '5.0.0-1'
    versionCode 5000001
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      debuggable false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    disable 'MissingClass'
  }

  packagingOptions {
    jniLibs {
      useLegacyPackaging = false
    }
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      res.srcDirs = ['res']
      assets.srcDirs = ['assets']
      jniLibs.srcDirs = ['libs']
    }
    androidTest {
      java.srcDirs = ['src/androidTest/java']
    }
  }
}

// NDK config: read from sys/android/local.properties, then env, then default path.
def localProps = new Properties()
def localPropsFile = file("${rootDir}/local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def ndkRoot = localProps.getProperty('ndk.dir') ?: System.getenv('ANDROID_NDK_ROOT')
if (!ndkRoot) {
    throw new GradleException(
        "NDK not found. Set ndk.dir in local.properties or export ANDROID_NDK_ROOT."
    )
}
def androidAbi = localProps.getProperty('android.abi') ?: 'arm64-v8a'
def androidPlatform = localProps.getProperty('android.platform') ?: '21'

task buildNative(type: Exec) {
    workingDir file('../../..')
    environment 'ANDROID_NDK_ROOT', ndkRoot
    environment 'ANDROID_ABI', androidAbi
    environment 'ANDROID_PLATFORM', androidPlatform
    doFirst {
        file("libs/${androidAbi}").mkdirs()
    }
    commandLine 'sh', '-c',
        "[ -f src/Makefile ] || sh sys/unix/setup.sh sys/unix/hints/android.500 && " +
        "rm -f src/monst.o src/objects.o src/date.o src/alloc.o src/dlb.o src/drawing.o src/hacklib.o src/hacklib.a && " +
        // Build host-side tools (makedefs, dlb, tilemap) with the host gcc
        // — the cross-compiled binaries from android-all can't run here.
        // -DDLB is required for util/dlb's main() to be active.
        // -DTILES_IN_GLYPHMAP must match the engine build so tilemap emits
        // the populated glyphmap[] in src/tile.c.
        "make -C util CC=gcc NHCFLAGS='-DUNIX -DDLB -DTILES_IN_GLYPHMAP -I../include' LFLAGS='' makedefs dlb tilemap && " +
        // Generate src/tile.c from the host tilemap binary.
        "( cd util && ./tilemap ) && " +
        // Generate the loose data files (data, rumors, oracles, ...).
        "make -C dat && " +
        // Pack the librarian payload into dat/nhdat. The file list mirrors
        // DATDLB in sys/unix/Makefile.top and the macOS Xcode project.
        "( cd dat && LC_ALL=C ../util/dlb cf nhdat " +
            "help hh cmdhelp keyhelp history opthelp optmenu usagehlp wizhelp " +
            "dungeon.lua tribute " +
            "asmodeus.lua baalz.lua bigrm-*.lua castle.lua fakewiz?.lua " +
            "juiblex.lua knox.lua medusa-?.lua minend-?.lua minefill.lua " +
            "minetn-?.lua oracle.lua orcus.lua sanctum.lua soko?-?.lua " +
            "tower?.lua valley.lua wizard?.lua nhcore.lua nhlib.lua themerms.lua " +
            "astral.lua air.lua earth.lua fire.lua water.lua hellfill.lua tut-?.lua " +
            "???-goal.lua ???-fil?.lua ???-loca.lua ???-strt.lua " +
            "bogusmon data engrave epitaph oracles options quest.lua rumors ) && " +
        "rm -f src/monst.o src/objects.o src/date.o src/alloc.o src/dlb.o src/drawing.o src/hacklib.o src/hacklib.a util/*.o && " +
        // Wipe the host-compiled Lua (objects + archives) so make android-all
        // recompiles it for aarch64 with the NDK clang instead of re-archiving
        // the x86-64 host objects into a wrongly-targeted library.
        "rm -f lib/lua-*/src/*.o lib/lua-*/src/liblua.a lib/lua/liblua-*.a && " +
        // Cross-compile the engine shared library.
        "make android-all && " +
        "cp src/libnethack.so sys/android/app/libs/${androidAbi}/libnethack.so && " +
        // Refresh assets/nethackdir: ship nhdat plus the few files NetHack
        // still reads outside the librarian.
        "ASSET_DIR=sys/android/app/assets/nethackdir && " +
        "find \$ASSET_DIR -maxdepth 1 -name '*.lua' -delete && " +
        "for f in bogusmon data engrave epitaph oracles options quest.lua rumors tribute " +
                 "help hh cmdhelp keyhelp history opthelp optmenu usagehlp wizhelp dungeon.lua; do " +
            "rm -f \$ASSET_DIR/\$f; done && " +
        "mkdir -p \$ASSET_DIR && " +
        "cp dat/nhdat \$ASSET_DIR/nhdat && " +
        "cp dat/symbols \$ASSET_DIR/symbols && " +
        "cp dat/license \$ASSET_DIR/license && " +
        "cp sys/android/defaults.nh \$ASSET_DIR/defaults.nh"
}

task cleanNative(type: Exec) {
    workingDir file('../../..')
    commandLine 'sh', '-c', '[ -f Makefile ] && make clean || true'
    ignoreExitValue true
}

preBuild.dependsOn buildNative
clean.dependsOn cleanNative

task alignApk {
    doLast {
        // Dynamically resolve build tools path from Android SDK
        def buildTools = android.sdkDirectory.toPath()
            .resolve("build-tools")
            .resolve(android.buildToolsVersion.toString())
        def zipalign = buildTools.resolve("zipalign").toString()
        def apksigner = buildTools.resolve("apksigner").toString()

        def debugApk = file("build/outputs/apk/debug/app-debug.apk")
        if (debugApk.exists()) {
            println "Aligning ${debugApk} to 16KB pages and 4-byte general alignment..."
            def tempApk = file("build/outputs/apk/debug/app-debug-aligned.apk")
            // -P 16 = 16KB page alignment for .so files (requires build tools 35.0.0+)
            // 4 = 4-byte general alignment
            exec {
                commandLine zipalign, "-f", "-P", "16", "4", debugApk, tempApk
            }
            exec {
                commandLine apksigner, "sign", "--ks", "${System.getProperty('user.home')}/.android/debug.keystore", "--ks-pass", "pass:android", tempApk
            }
            debugApk.delete()
            tempApk.renameTo(debugApk)
        }
    }
}

task alignReleaseApk {
    doLast {
        def buildTools = android.sdkDirectory.toPath()
            .resolve("build-tools")
            .resolve(android.buildToolsVersion.toString())
        def zipalign = buildTools.resolve("zipalign").toString()
        def apksigner = buildTools.resolve("apksigner").toString()

        def releaseApk = file("build/outputs/apk/release/app-release.apk")
        if (releaseApk.exists()) {
            println "Aligning ${releaseApk} to 16KB pages and 4-byte general alignment..."
            def tempApk = file("build/outputs/apk/release/app-release-aligned.apk")
            exec {
                commandLine zipalign, "-f", "-P", "16", "4", releaseApk, tempApk
            }
            exec {
                commandLine apksigner, "sign",
                    "--ks", "${System.getProperty('user.home')}/.android/debug.keystore",
                    "--ks-pass", "pass:android", tempApk
            }
            releaseApk.delete()
            tempApk.renameTo(releaseApk)
        }
    }
}

// Hook it after the APK is created but before installation
tasks.whenTaskAdded { task ->
    if (task.name == 'packageDebug') {
        task.finalizedBy alignApk
    }
    if (task.name == 'packageRelease') {
        task.finalizedBy alignReleaseApk
    }
}

dependencies {
  implementation 'com.tbd.forkfront:lib:1.1'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
